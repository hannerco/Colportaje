# Falla si la versión de Node o de pnpm no es la fijada en package.json (HU-BASE-01 R6).
engineStrict: true
# Scripts de instalación permitidos. esbuild (tsx, Serwist) y @swc/core (Serwist) no los necesitan:
# sus binarios llegan por dependencias opcionales.
allowBuilds:
  esbuild: false
  '@swc/core': false
